<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>layout</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f0f0f0;
    color: #000000;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 800px;
    padding: 8vh 4vw;
}

h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-top: 2.5rem;
    margin-bottom: 1.2rem;
}

p, a {
    font-size: 1.15rem;
    line-height: 2;
}

a {
    display: block;
    text-decoration: none;
}

a:visited {
    color: #8b3a3a;
}

a:first-of-type {
    color: #800080;
}
</style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <h1>layout</h1>
        <p>layout</p>

        <h1>log</h1>
        <a href="https://example.com">test</a>
        <a href="https://example.com">test</a>
        <a href="https://example.com">test<a>
        <a href="https://example.com">test</a>
    </div>
</body>
</html>
